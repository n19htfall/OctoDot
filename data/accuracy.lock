# The accuracy set's outside sources (make accuracy, make test), each pinned
# to a commit and a SHA-256. Fetched into .data/accuracy/ on developer
# machines and CI only, for testing: none of it is committed or shipped.
#
#   rime-schema-compare (the jidzhang fork of gaboolic's benchmark): zhihu120,
#     120 sentences of Zhihu text, and words234, 450 frequent words, each
#     with readings audited by hand, and the whole Zhihu corpus they come
#     from. Its reports give librime's results on the same sentences (万象 on
#     zhihu120: 48.33% whole, 89.27% of characters; on the corpus, 54.33% and
#     90.34%, and with its grammar model 63.85% and 92.47%). The
#     repository states no license, and the text is Zhihu users': fetched
#     for testing here, never redistributed.
#   THUOCL (Tsinghua University, MIT): names, places and idioms with how
#     many documents use each, for taking the most used.
#   phrase-pinyin-data (mozillazg, MIT): readings of words that do not come
#     from 万象, which also decide what counts as a word.
#
# tools/fetch-pinned.sh data/accuracy.lock .data/accuracy fetches exactly
# these; --rehash rewrites the hashes after the URLs are moved to other commits.
#
#    sha256 path url
